<!DOCTYPE html>
<html>
<head>
  <title>Gesture Receiver</title>
  <style>
    body { text-align:center; font-family:Arial; }

    #box {
      margin:50px auto;
      width:300px;
      height:300px;
      border:2px dashed #333;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }

    img {
      width:100px;
      margin:5px;
    }
  </style>
</head>

<body>

<h2>Drop Zone</h2>

<div id="box"></div>

<script>
const socket = new WebSocket("ws://10.36.5.197:8081");
// const socket = new WebSocket("ws://192.168.29.189:8081");

const box = document.getElementById("box");

socket.onmessage = (event) => {
  const data = JSON.parse(event.data);

  if (data.type === "TRANSFER") {
    const img = document.createElement("img");
    img.src = data.src;
    box.innerHTML = "";
    box.appendChild(img);
  }
};
</script>

</body>
</html>
