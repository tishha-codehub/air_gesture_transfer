<!DOCTYPE html>
<html>

<head>
    <title>Gesture Sender</title>

    <!-- MediaPipe -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script> -->

    <!-- MediaPipe -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4/hands.js"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        video {
            display: none;
        }

        #cursor {
            position: absolute;
            width: 15px;
            height: 15px;
            background: blue;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        #image {
            width: 150px;
            margin-top: 50px;
            cursor: pointer;
        }

        #floating {
            position: absolute;
            width: 120px;
            display: none;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <h2>Gesture Pick & Send</h2>

    <img id="image" src="my_image.jpg">

    <img id="floating">

    <div id="cursor"></div>

    <video id="video" autoplay playsinline></video>

    <script>
        const socket = new WebSocket("ws://10.36.5.197:8081");
        const video = document.getElementById("video");
        const cursor = document.getElementById("cursor");
        const floating = document.getElementById("floating");
        const image = document.getElementById("image");
        let isHolding = false;
        let prevPinch = false;

        function getDistance(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        const hands = new Hands({
            locateFile: (file) => {
                if (file.endsWith(".tflite")) {
                    return `models/${file}`;
                }
                // return `models/${file}`;
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }

        });

        hands.setOptions({
            maxNumHands: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

            const lm = results.multiHandLandmarks[0];

            const index = lm[8];
            const thumb = lm[4];

            // 👉 Screen position
            const x = (1 - index.x) * window.innerWidth;
            const y = index.y * window.innerHeight;

            // 👉 Smooth movement (VERY IMPORTANT)
            smoothX = smoothX * 0.8 + x * 0.2;
            smoothY = smoothY * 0.8 + y * 0.2;

            cursor.style.left = smoothX + "px";
            cursor.style.top = smoothY + "px";

            // 👉 Distance for pinch
            const distance = Math.hypot(
                thumb.x - index.x,
                thumb.y - index.y
            );

            const isPinching = distance < 0.08; // relaxed threshold

            // 👉 Visual feedback
            cursor.style.background = isPinching ? "red" : "blue";

            // =========================
            // 🎯 PICK (Improved)
            // =========================

            if (isPinching && !prevPinch) {
                const rect = image.getBoundingClientRect();

                if (
                    smoothX > rect.left &&
                    smoothX < rect.right &&
                    smoothY > rect.top &&
                    smoothY < rect.bottom
                ) {
                    isHolding = true;
                    floating.src = image.src;
                    floating.style.display = "block";
                }
            }

            // =========================
            // 🎯 MOVE
            // =========================

            if (isHolding) {
                floating.style.left = smoothX + "px";
                floating.style.top = smoothY + "px";
            }

            // =========================
            // 🎯 DROP
            // =========================

            if (!isPinching && prevPinch && isHolding) {
                isHolding = false;
                floating.style.display = "none";

                socket.send(JSON.stringify({
                    type: "TRANSFER",
                    src: image.src
                }));
            }

            prevPinch = isPinching;
        });
        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            }
        });

        camera.start();
    </script>

</body>

</html>
